name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # the site is a React + Vite + Tailwind app; build it from source
      - name: Build the site
        working-directory: web
        run: |
          npm ci
          mkdir -p ../site/assets
          cp -f ../data/skills.raw.json /tmp/ 2>/dev/null || true
          bash build.sh

      - uses: actions/configure-pages@v5
        with:
          path: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
